name: Julia CI

on:
  push:
  pull_request:

jobs:
  mp-export:
    name: Offline MP exporter tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify source release archive
        run: |
          python -m unittest discover -s test -p 'test_release_audit.py' -v
          python scripts/verify_release.py --archive HEAD
      - run: python -m unittest discover -s test -p 'test_mp_export.py' -v
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1.10', '1']
        os: [ubuntu-latest]
        include:
          - julia-version: '1'
            os: macos-latest
          - julia-version: '1'
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        if: matrix.os == 'ubuntu-latest' && matrix.julia-version == '1'
        continue-on-error: true
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  analysis:
    # The independent Python analysers are exercised across supported Python
    # versions here; the Julia job above stays pure Julia across operating
    # systems. Both need Julia, because each analyser consumes a bundle that the
    # Julia pipeline produces.
    name: Analysis / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline synthetic PU end-to-end example
        shell: bash
        run: |
          julia --project=. examples/mp_recovery/make_snapshot.jl "$RUNNER_TEMP/pu-snapshot"
          julia --project=. bin/eka audit-mp --snapshot "$RUNNER_TEMP/pu-snapshot" --output "$RUNNER_TEMP/pu-audit"
          julia --project=. bin/eka split-mp --snapshot "$RUNNER_TEMP/pu-snapshot" --audit "$RUNNER_TEMP/pu-audit" --output "$RUNNER_TEMP/pu-splits" --synthetic --budget 1 4
          julia --project=. bin/eka benchmark-pu --splits "$RUNNER_TEMP/pu-splits" --snapshot "$RUNNER_TEMP/pu-snapshot" --audit "$RUNNER_TEMP/pu-audit" --output "$RUNNER_TEMP/pu-results" --synthetic
          python scripts/analyze_pu_pilot.py "$RUNNER_TEMP/pu-results" "$RUNNER_TEMP/pu-analysis"
          python -m unittest discover -s test -p 'test_pu_analysis.py' -v
          python -m unittest discover -s test -p 'test_label_sensitivity_analysis.py' -v
          python -m unittest discover -s test -p 'test_system_holdout_analysis.py' -v
          python -m unittest discover -s test -p 'test_element_pair_analysis.py' -v
